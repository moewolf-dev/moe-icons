name: Secrets permission probe (read-only)

# DEV-20-05: verify the public-repo CODE_LIBRARY_ARTIFACT_READ_TOKEN can
# download a SPECIFIC frozen private code-library Actions artifact. No
# Release/npm writes. Inputs are required so an expired artifact or a different
# run/commit cannot be misdiagnosed as a permission failure.

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Frozen code-library Actions artifact ID (numeric)
        required: true
        type: string
      expected_sha256:
        description: Expected SHA-256 of the downloaded artifact zip
        required: true
        type: string
      expected_head_sha:
        description: Expected producer workflow head SHA (40 hex)
        required: true
        type: string
      expected_run_id:
        description: Expected producer workflow run ID (numeric)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: secrets-permission-probe-public
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    # Keep this probe in the same environment as free-release.yml. The
    # CODE_LIBRARY_ARTIFACT_READ_TOKEN is intentionally environment-scoped;
    # adding a repository secret with the same name would make this probe test
    # a different credential from the production download path.
    environment: free-release
    timeout-minutes: 5
    steps:
      - name: Probe CODE_LIBRARY_ARTIFACT_READ_TOKEN
        env:
          GH_TOKEN: ${{ secrets.CODE_LIBRARY_ARTIFACT_READ_TOKEN }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          EXPECTED_SHA: ${{ inputs.expected_sha256 }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_RUN_ID: ${{ inputs.expected_run_id }}
          PRODUCER_REPO: moewolf-dev/moe-icons-code-library
        run: |
          set -euo pipefail
          PRESENT=FAIL
          AUTH_OK=FAIL
          SCOPE_OK=FAIL
          TARGET_OK=UNKNOWN
          fail() {
            echo "PRESENT=${PRESENT} AUTH_OK=${AUTH_OK} SCOPE_OK=${SCOPE_OK} TARGET_OK=${TARGET_OK}"
            echo "$1" >&2
            exit 1
          }

          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]] || fail "artifact_id must be numeric"
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{64}$ ]] || fail "expected_sha256 must be 64 lowercase hex"
          [[ "$EXPECTED_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] || fail "expected_head_sha must be a 40-hex commit"
          [[ "$EXPECTED_RUN_ID" =~ ^[0-9]+$ ]] || fail "expected_run_id must be numeric"

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "PRESENT=FAIL"
            fail "CODE_LIBRARY_ARTIFACT_READ_TOKEN is missing"
          fi
          PRESENT=OK
          echo "::add-mask::$GH_TOKEN"

          auth="$(curl -sS -o "$RUNNER_TEMP/artifact.json" -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${PRODUCER_REPO}/actions/artifacts/${ARTIFACT_ID}")"
          [ "$auth" = "200" ] || fail "artifact metadata HTTP ${auth} (AUTH)"
          AUTH_OK=OK

          expired="$(node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/artifact.json','utf8')).expired))")"
          [ "$expired" = "false" ] || fail "artifact ${ARTIFACT_ID} is expired; pick a fresh frozen artifact"

          if [ -n "${EXPECTED_HEAD_SHA:-}" ]; then
            head="$(node -e "const r=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/artifact.json','utf8'));process.stdout.write(String((r.workflow_run||{}).head_sha||''))")"
            [ "$head" = "$EXPECTED_HEAD_SHA" ] || fail "producer head_sha ${head} != expected ${EXPECTED_HEAD_SHA}"
          fi
          if [ -n "${EXPECTED_RUN_ID:-}" ]; then
            run_id="$(node -e "const r=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/artifact.json','utf8'));process.stdout.write(String((r.workflow_run||{}).id||''))")"
            [ "$run_id" = "$EXPECTED_RUN_ID" ] || fail "producer run_id ${run_id} != expected ${EXPECTED_RUN_ID}"
          fi

          http=$(curl -sS -o "$RUNNER_TEMP/probe-artifact.zip" -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -L "https://api.github.com/repos/${PRODUCER_REPO}/actions/artifacts/${ARTIFACT_ID}/zip")
          [ "$http" = "200" ] && [ -s "$RUNNER_TEMP/probe-artifact.zip" ] || fail "artifact download HTTP ${http}"
          magic=$(od -An -tx1 -N2 "$RUNNER_TEMP/probe-artifact.zip" | tr -d ' \n')
          [ "$magic" = "504b" ] || fail "downloaded artifact is not a zip"
          SCOPE_OK=OK

          actual="$(sha256sum "$RUNNER_TEMP/probe-artifact.zip" | awk '{print $1}')"
          [ "$actual" = "$EXPECTED_SHA" ] || fail "artifact sha256 ${actual} != expected ${EXPECTED_SHA}"
          # TARGET_OK is only set after every identity + digest check passes.
          TARGET_OK=OK

          echo "PRESENT=${PRESENT} AUTH_OK=${AUTH_OK} SCOPE_OK=${SCOPE_OK} TARGET_OK=${TARGET_OK} sha256=${actual}"
