name: Existing Free credential Worker dispatch authorization probe
on:
  workflow_dispatch:
    inputs:
      artifact_id: { required: true, type: string }
      expected_artifact_name: { required: true, type: string }
      expected_head_sha: { required: true, type: string }
      expected_run_id: { required: true, type: string }
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: free-release
    timeout-minutes: 5
    steps:
      - name: Probe existing Free environment credential against Worker
        env:
          GH_TOKEN: ${{ secrets.CODE_LIBRARY_ARTIFACT_READ_TOKEN }}
        run: |
          set -eu
          test -n "$GH_TOKEN"
          echo "::add-mask::$GH_TOKEN"
          gh api repos/moewolf-dev/moe-icons-web-worker/dispatches --method POST -f event_type=small-pack-credential-probe-20261029 >/dev/null
          echo 'DISPATCH_AUTHORIZED moewolf-dev/moe-icons-web-worker'
