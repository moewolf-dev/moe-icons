name: Secrets permission probe (read-only)

# Gate 6R-7: verify public-repo CODE_LIBRARY_ARTIFACT_READ_TOKEN can download
# a private code-library Actions artifact. No Release/npm writes.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-permission-probe-public
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe CODE_LIBRARY_ARTIFACT_READ_TOKEN
        env:
          GH_TOKEN: ${{ secrets.CODE_LIBRARY_ARTIFACT_READ_TOKEN }}
          ARTIFACT_ID: "10058330172"
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "ARTIFACT_PROBE=MISSING_SECRET"
            exit 1
          fi
          echo "::add-mask::$GH_TOKEN"
          http=$(curl -sS -o "$RUNNER_TEMP/probe-artifact.zip" -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -L "https://api.github.com/repos/moewolf-dev/moe-icons-code-library/actions/artifacts/${ARTIFACT_ID}/zip")
          if [ "$http" != "200" ] || [ ! -s "$RUNNER_TEMP/probe-artifact.zip" ]; then
            echo "ARTIFACT_PROBE=FAIL_HTTP_${http}"
            exit 1
          fi
          magic=$(od -An -tx1 -N2 "$RUNNER_TEMP/probe-artifact.zip" | tr -d ' \n')
          if [ "$magic" != "504b" ]; then
            echo "ARTIFACT_PROBE=FAIL_NOT_ZIP"
            exit 1
          fi
          bytes=$(wc -c < "$RUNNER_TEMP/probe-artifact.zip" | tr -d ' ')
          echo "ARTIFACT_PROBE=OK bytes=${bytes} http=${http}"
          echo "Public CODE_LIBRARY_ARTIFACT_READ_TOKEN permission OK"
