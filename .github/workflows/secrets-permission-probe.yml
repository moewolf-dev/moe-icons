name: Secrets permission probe (read-only)

# DEV-20-05: verify the public-repo CODE_LIBRARY_ARTIFACT_READ_TOKEN can read
# metadata for one exact small-package metadata artifact. This deliberately
# does not download artifact bytes, so a legacy aggregate cannot be fetched.

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Frozen code-library Actions artifact ID (numeric)
        required: true
        type: string
      expected_artifact_name:
        description: Exact moe-small metadata artifact name (plan/record/wave-results/candidate/durable)
        required: true
        type: string
      expected_head_sha:
        description: Expected producer workflow head SHA (40 hex)
        required: true
        type: string
      expected_run_id:
        description: Expected producer workflow run ID (numeric)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: secrets-permission-probe-public
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    # Keep this probe in the same environment as free-release.yml. The
    # CODE_LIBRARY_ARTIFACT_READ_TOKEN is intentionally environment-scoped;
    # adding a repository secret with the same name would make this probe test
    # a different credential from the production download path.
    environment: free-release
    timeout-minutes: 5
    steps:
      - name: Probe CODE_LIBRARY_ARTIFACT_READ_TOKEN
        env:
          GH_TOKEN: ${{ secrets.CODE_LIBRARY_ARTIFACT_READ_TOKEN }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          EXPECTED_NAME: ${{ inputs.expected_artifact_name }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_RUN_ID: ${{ inputs.expected_run_id }}
          PRODUCER_REPO: moewolf-dev/moe-icons-code-library
        run: |
          set -euo pipefail
          PRESENT=FAIL
          AUTH_OK=FAIL
          SCOPE_OK=UNKNOWN
          TARGET_OK=UNKNOWN
          fail() {
            echo "PRESENT=${PRESENT} AUTH_OK=${AUTH_OK} SCOPE_OK=${SCOPE_OK} TARGET_OK=${TARGET_OK}"
            echo "$1" >&2
            exit 1
          }

          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]] || fail "artifact_id must be numeric"
          [[ "$EXPECTED_NAME" =~ ^moe-small-(plan|record|wave-results|candidate|durable)-[A-Za-z0-9._-]+$ ]] || fail "expected_artifact_name must name a small-package metadata artifact"
          [[ "$EXPECTED_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] || fail "expected_head_sha must be a 40-hex commit"
          [[ "$EXPECTED_RUN_ID" =~ ^[0-9]+$ ]] || fail "expected_run_id must be numeric"

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "PRESENT=FAIL"
            fail "CODE_LIBRARY_ARTIFACT_READ_TOKEN is missing"
          fi
          PRESENT=OK
          echo "::add-mask::$GH_TOKEN"

          auth="$(curl -sS -o "$RUNNER_TEMP/artifact.json" -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${PRODUCER_REPO}/actions/artifacts/${ARTIFACT_ID}")"
          [ "$auth" = "200" ] || fail "artifact metadata HTTP ${auth} (AUTH)"
          AUTH_OK=OK

          metadata_result="$(node <<'NODE'
          const fs = require('node:fs');
          const a = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/artifact.json', 'utf8'));
          const expectedName = process.env.EXPECTED_NAME;
          const allowedName = /^moe-small-(plan|record|wave-results|candidate|durable)-[A-Za-z0-9._-]+$/;
          if (a.expired !== false) throw new Error('artifact is expired');
          if (a.name !== expectedName || !allowedName.test(a.name || '')) throw new Error('artifact name is not the exact expected metadata artifact');
          if (!Number.isSafeInteger(a.size_in_bytes) || a.size_in_bytes < 1 || a.size_in_bytes > 5 * 1024 * 1024) throw new Error('artifact metadata size exceeds the 5 MiB metadata-only limit');
          const run = a.workflow_run || {};
          if (String(run.head_sha || '') !== process.env.EXPECTED_HEAD_SHA) throw new Error('producer head_sha does not match');
          if (String(run.id || '') !== process.env.EXPECTED_RUN_ID) throw new Error('producer run_id does not match');
          process.stdout.write(`${a.name}\t${a.size_in_bytes}`);
          NODE
          )" || fail "artifact metadata did not match the exact bounded metadata target"
          IFS=$'\t' read -r actual_name actual_size <<< "$metadata_result"
          SCOPE_OK=METADATA_ONLY_OK
          # TARGET_OK is set after exact name, run, head and size checks pass.
          TARGET_OK=OK

          echo "PRESENT=${PRESENT} AUTH_OK=${AUTH_OK} SCOPE_OK=${SCOPE_OK} TARGET_OK=${TARGET_OK} name=${actual_name} bytes=${actual_size}"
