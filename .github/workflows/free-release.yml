name: Publish validated free artifact

# E2E-F4A (ICON-E2E-0907): the public repo is not a build source. It consumes
# the free-only candidate produced by moe-icons-code-library AFTER clitest/
# webtest + resource acceptance, re-verifies every byte, and publishes the
# immutable `v<resourceVersion>` Release. No human approval / required reviewer.
# `workflow_dispatch` is retained only for `dry_run:true` (no writes).

run-name: acceptance ${{ github.event.client_payload.correlationId || inputs.correlationId || github.sha }}

on:
  repository_dispatch:
    types: [moe-icons-free-release]
  workflow_dispatch:
    inputs:
      resourceVersion:
        description: Immutable resource version
        required: false
        type: string
      artifactId:
        description: Code-library free-only Actions artifact id
        required: false
        type: string
      publicDescriptorSha:
        description: Public free descriptor SHA-256
        required: false
        type: string
      sourceCommit:
        required: false
        type: string
      generatorCommit:
        required: false
        type: string
      upstreamRunId:
        required: false
        type: string
      correlationId:
        description: F4 correlation id (<upstreamRunId>-<attempt>-free-release)
        required: false
        type: string
      dry_run:
        description: dry_run=true forces zero write operations
        required: false
        default: "true"
        type: string

permissions:
  contents: write

concurrency:
  group: free-release-${{ github.event.client_payload.resourceVersion || inputs.resourceVersion }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: free-release
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Reject workflow_dispatch writes
        id: dispatchcheck
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" != "true" ]; then
            echo "workflow_dispatch is reserved for dry_run=true" >&2
            exit 1
          fi
          echo "write_allowed=1" >> "$GITHUB_OUTPUT"

      - name: Check auto-release switch (F6)
        id: switch
        env:
          MOEICONS_AUTO_RELEASE_ENABLED: ${{ vars.MOEICONS_AUTO_RELEASE_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "blocked=0" >> "$GITHUB_OUTPUT"
          elif [ "$MOEICONS_AUTO_RELEASE_ENABLED" != "true" ]; then
            echo "blocked=1" >> "$GITHUB_OUTPUT"
          else
            echo "blocked=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate dispatch payload
        id: payload
        if: steps.switch.outputs.blocked == '0'
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION: ${{ github.event.client_payload.resourceVersion || inputs.resourceVersion }}
          ARTIFACT_ID: ${{ github.event.client_payload.artifactId || inputs.artifactId }}
          DESCRIPTOR_SHA: ${{ github.event.client_payload.publicDescriptorSha || inputs.publicDescriptorSha }}
          SOURCE_COMMIT: ${{ github.event.client_payload.sourceCommit || inputs.sourceCommit }}
          GENERATOR_COMMIT: ${{ github.event.client_payload.generatorCommit || inputs.generatorCommit }}
          UPSTREAM_RUN_ID: ${{ github.event.client_payload.upstreamRunId || inputs.upstreamRunId }}
          CORRELATION_ID: ${{ github.event.client_payload.correlationId || inputs.correlationId }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version" >&2; exit 1; }
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]] || { echo "Invalid artifactId" >&2; exit 1; }
          [[ "$DESCRIPTOR_SHA" =~ ^[a-f0-9]{64}$ ]] || { echo "Invalid descriptor sha" >&2; exit 1; }
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]] || { echo "Invalid source commit" >&2; exit 1; }
          [[ "$GENERATOR_COMMIT" =~ ^[a-f0-9]{40}$ ]] || { echo "Invalid generator commit" >&2; exit 1; }
          [[ "$UPSTREAM_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid upstream run id" >&2; exit 1; }
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            [[ "$CORRELATION_ID" =~ ^[0-9]+-[0-9]+-free-release$ ]] || {
              echo "Invalid correlationId for repository_dispatch" >&2
              exit 1
            }
          fi
          {
            echo "VERSION=$VERSION"
            echo "ARTIFACT_ID=$ARTIFACT_ID"
            echo "DESCRIPTOR_SHA=$DESCRIPTOR_SHA"
            echo "SOURCE_COMMIT=$SOURCE_COMMIT"
            echo "GENERATOR_COMMIT=$GENERATOR_COMMIT"
            echo "UPSTREAM_RUN_ID=$UPSTREAM_RUN_ID"
            echo "CORRELATION_ID=${CORRELATION_ID:-}"
          } >> "$GITHUB_ENV"

      - name: Download free-only candidate
        if: steps.switch.outputs.blocked == '0'
        env:
          GH_TOKEN: ${{ secrets.CODE_LIBRARY_ARTIFACT_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          echo "::add-mask::$GH_TOKEN"
          mkdir "$RUNNER_TEMP/candidate"
          gh api "repos/moewolf-dev/moe-icons-code-library/actions/artifacts/${ARTIFACT_ID}/zip" > "$RUNNER_TEMP/candidate.zip"
          unzip -q "$RUNNER_TEMP/candidate.zip" -d "$RUNNER_TEMP/candidate"

      - id: validate
        name: Revalidate public descriptor and all free archives
        if: steps.switch.outputs.blocked == '0'
        run: |
          set -euo pipefail
          node scripts/validate-free-release.mjs "$RUNNER_TEMP/candidate" "$VERSION" "$DESCRIPTOR_SHA" "$SOURCE_COMMIT" "$GENERATOR_COMMIT" > "$RUNNER_TEMP/validated.json"
          echo "asset_sha=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(process.argv[1])).sha256)" "$RUNNER_TEMP/validated.json")" >> "$GITHUB_OUTPUT"
          echo "metadata_sha=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(process.argv[1])).metadata.sha256)" "$RUNNER_TEMP/validated.json")" >> "$GITHUB_OUTPUT"
          echo "assets_sha=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(process.argv[1])).assets.sha256)" "$RUNNER_TEMP/validated.json")" >> "$GITHUB_OUTPUT"

      - name: Enforce immutable idempotency
        id: existing
        if: steps.switch.outputs.blocked == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir "$RUNNER_TEMP/existing"
          gh release download "$tag" \
            --pattern "moe-icons-free-${VERSION}.tgz*" \
            --pattern "moe-icons-free-assets-${VERSION}.tgz*" \
            --pattern "moe-icons-free-metadata-${VERSION}.tgz*" \
            --pattern "release-descriptor.json" \
            --dir "$RUNNER_TEMP/existing"
          node scripts/compare-release.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/existing" "$VERSION" "$DESCRIPTOR_SHA"
          echo "exists=true" >> "$GITHUB_OUTPUT"

      - name: Create immutable free release
        if: steps.switch.outputs.blocked == '0' && steps.existing.outputs.exists != 'true' && steps.dispatchcheck.outputs.write_allowed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            "$RUNNER_TEMP/candidate/moe-icons-free-${VERSION}.tgz" \
            "$RUNNER_TEMP/candidate/moe-icons-free-${VERSION}.tgz.sha256" \
            "$RUNNER_TEMP/candidate/moe-icons-free-assets-${VERSION}.tgz" \
            "$RUNNER_TEMP/candidate/moe-icons-free-assets-${VERSION}.tgz.sha256" \
            "$RUNNER_TEMP/candidate/moe-icons-free-metadata-${VERSION}.tgz" \
            "$RUNNER_TEMP/candidate/moe-icons-free-metadata-${VERSION}.tgz.sha256" \
            "$RUNNER_TEMP/candidate/release-descriptor.json" \
            --title "Moe Icons free ${VERSION}" \
            --notes "Source: ${SOURCE_COMMIT}\nGenerator: ${GENERATOR_COMMIT}\ncontentHash: see descriptor"

      - name: Re-read uploaded assets and publish latest descriptor
        if: steps.switch.outputs.blocked == '0' && steps.dispatchcheck.outputs.write_allowed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          mkdir -p "$RUNNER_TEMP/uploaded"
          gh release download "$tag" \
            --pattern "moe-icons-free-${VERSION}.tgz" \
            --pattern "moe-icons-free-assets-${VERSION}.tgz" \
            --pattern "moe-icons-free-metadata-${VERSION}.tgz" \
            --pattern "release-descriptor.json" \
            --dir "$RUNNER_TEMP/uploaded"
          node scripts/write-latest-descriptor.mjs "$RUNNER_TEMP/uploaded" "$VERSION" "$DESCRIPTOR_SHA"
          gh release upload "$tag" "$RUNNER_TEMP/uploaded/release-latest.json" --clobber

      - name: Dry-run / blocked conclusion
        if: steps.switch.outputs.blocked == '1' || steps.dispatchcheck.outputs.write_allowed != '1'
        run: |
          echo "dry_run or switch disabled: validated payload but created/uploaded nothing"
