name: Docs check

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/docs-check.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs-check.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/docs-check.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run docs:check
      - run: npm run docs:build
