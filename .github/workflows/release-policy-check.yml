name: Release policy check

on:
  # No path filter on pull_request: this is the required status check for the
  # protected main branch, so it must report on EVERY PR (a path filter would
  # leave unrelated PRs pending forever).
  pull_request:
  push:
    branches: [main]
    paths:
      - 'contracts/release-policy/**'
      - '.github/CODEOWNERS'
      - '.github/workflows/release-policy-check.yml'
      - '.github/workflows/sync-release-policy.yml'
      - 'scripts/sync-release-policy.mjs'
      - 'scripts/test-release-policy.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-policy-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test scripts/test-release-policy.mjs
